name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m unittest discover -s tests -v
  cloud-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the Site shares the complete local UI
        run: python3 scripts/sync-site-ui.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: sites
      - run: npm run build && npm run validate && node scripts/test-worker.mjs && node scripts/test-cloud-state.mjs && node scripts/test-mcp.mjs && node scripts/test-mcp-sdk.mjs
        working-directory: sites
